services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orcamentos
      POSTGRES_USER: orcamentos
      POSTGRES_PASSWORD: orcamentos
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcamentos -d orcamentos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
