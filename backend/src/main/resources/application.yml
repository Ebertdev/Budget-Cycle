spring:
  application:
    name: orcamentos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orcamentos}
    username: ${DB_USER:orcamentos}
    password: ${DB_PASSWORD:orcamentos}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
  fuso: ${APP_FUSO:America/Bahia}
